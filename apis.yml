aid: strata-identity
name: Strata Identity
description: >-
  Strata Identity is a multi-cloud identity orchestration and agentic AI security
  company whose Maverics platform lets organizations unify authentication and
  authorization across multiple clouds, identity providers, and applications, and
  govern AI agent access at runtime, without rewriting apps or consolidating identity
  providers. The platform pairs the Maverics Orchestrator, a lightweight identity
  abstraction layer that routes auth between apps and any IdP (SAML, OIDC, LDAP,
  Active Directory), with a hosted Maverics Console for visual configuration,
  policy, and lifecycle management. It adds SSO, MFA, and authorization policy to
  legacy and modern apps, provides identity continuity during IdP outages, and now
  secures MCP servers and AI agents through an AI Identity Gateway. The Console
  exposes a public management API automated with OAuth 2.0 client-credentials
  clients. Founded by CEO Eric Olden, co-author of the SAML standard and creator of
  the Identity Query Language (IDQL) and the open-source Hexa project; Strata is now
  part of Rubrik.
